name: ReyPortfolioNative
options:
  bundleIdPrefix: com.reyvictor
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
targets:
  ReyPortfolioNative:
    type: application
    platform: iOS
    sources:
      - path: ReyPortfolioNative
      - path: Resources/Resume.pdf
        buildPhase: resources
      - path: Resources/app
        type: folder
        buildPhase: resources
      - path: Resources/Models
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Vendor/Python.xcframework
        embed: true
      - framework: Vendor/llama.xcframework
        embed: true
    postBuildScripts:
      - name: Bundle Python standard library
        basedOnDependencyAnalysis: false
        script: |
          set -e
          export EXPANDED_CODE_SIGN_IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          source "$PROJECT_DIR/Vendor/Python.xcframework/build/utils.sh"
          install_python Vendor/Python.xcframework app
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: ReyPortfolioNative/RuntimeBridge.h
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.reyvictor.portfolioos.native
        PRODUCT_NAME: ReyPortfolioNative
        MARKETING_VERSION: 2.0.0
        CURRENT_PROJECT_VERSION: 20
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Rey Portfolio Native
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    scheme:
      gatherCoverageData: false

  ReyPortfolioNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: ReyPortfolioNative
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.reyvictor.portfolioos.native.tests
schemes:
  ReyPortfolioNative:
    build:
      targets:
        ReyPortfolioNative: all
    test:
      targets:
        - ReyPortfolioNativeTests
