name: IPABuilder
options:
  bundleIdPrefix: com.rvmendillo
  deploymentTarget:
    iOS: "17.0"

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
  LlamaSwift:
    url: https://github.com/mattt/llama.swift
    from: 2.10549.0
  Zsign:
    url: https://github.com/claration/Zsign-Package.git
    revision: 6ffe703df73ef9069adacdbb19d571f11a69a801

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  IPABuilder:
    type: application
    platform: iOS
    sources:
      - path: App.swift
      - path: StudioModels.swift
      - path: Studio2Workspace.swift
      - path: StudioComponentRenderer.swift
      - path: StudioPanels.swift
      - path: LocalVibeModel.swift
      - path: LegacyModelCompatibility.swift
      - path: QuickVibe.swift
      - path: PreviewRuntime.swift
      - path: SigningVault.swift
      - path: ReyForgeRootV21.swift
      - path: GitHubBuildManager.swift
      - path: Resources
        buildPhase: resources
      - path: Assets.xcassets
    dependencies:
      - package: ZIPFoundation
      - package: LlamaSwift
      - package: Zsign
        product: ZsignSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rvmendillo.ipabuilder
        PRODUCT_NAME: ReyForge
        MARKETING_VERSION: "2.2"
        CURRENT_PROJECT_VERSION: "6"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "ReyForge"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
