name: IPABuilder
options:
  bundleIdPrefix: com.rvmendillo
  deploymentTarget:
    iOS: "17.0"

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  IPABuilder:
    type: application
    platform: iOS
    sources:
      - path: App.swift
      - path: WorkspaceView.swift
      - path: GitHubBuildManager.swift
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rvmendillo.ipabuilder
        PRODUCT_NAME: IPABuilder
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "IPA Builder"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
