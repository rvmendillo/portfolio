name: VoxHarmony
options:
  bundleIdPrefix: com.rvmendillo
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""
targets:
  VoxHarmony:
    type: application
    platform: iOS
    sources:
      - path: VoxHarmony
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rvmendillo.voxharmony
        PRODUCT_NAME: VoxHarmony
        PRODUCT_MODULE_NAME: VoxHarmony
        MARKETING_VERSION: 0.3.0
        CURRENT_PROJECT_VERSION: 3
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: VoxHarmony
        INFOPLIST_KEY_NSMicrophoneUsageDescription: VoxHarmony uses the microphone to record your singing voice for on-device AI melody transcription, key, scale, chord and harmony processing.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
