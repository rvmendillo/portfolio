name: NFCForge
options:
  bundleIdPrefix: app.seaweed4660
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
targets:
  NFCForge:
    type: application
    platform: iOS
    sources:
      - NFCForge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.seaweed4660.tiger8048
        CODE_SIGN_ENTITLEMENTS: NFCForge/NFCForge.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: NFCForge/Info.plist
        TARGETED_DEVICE_FAMILY: '1'
    entitlements:
      path: NFCForge/NFCForge.entitlements
