name: Build iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Import signing certificate (optional)
        if: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' && secrets.IOS_CERTIFICATE_PASSWORD != '' && secrets.IOS_PROVISION_PROFILE_BASE64 != '' }}
        env:
          CERT: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: build-keychain-pass
        run: |
          echo "$CERT" | base64 --decode > certificate.p12
          echo "$PROFILE" | base64 --decode > profile.mobileprovision
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k build.keychain
          security list-keychain -d user -s build.keychain login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i profile.mobileprovision)")
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision

      - name: Build signed archive
        if: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' && secrets.IOS_CERTIFICATE_PASSWORD != '' && secrets.IOS_PROVISION_PROFILE_BASE64 != '' }}
        run: |
          xcodebuild -project NFCForge.xcodeproj -scheme NFCForge -configuration Release -sdk iphoneos -archivePath build/NFCForge.xcarchive archive CODE_SIGN_STYLE=Manual PROVISIONING_PROFILE_SPECIFIER="${{ secrets.IOS_PROVISION_PROFILE_NAME }}" DEVELOPMENT_TEAM="${{ secrets.IOS_TEAM_ID }}"
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>development</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${{ secrets.IOS_TEAM_ID }}</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/NFCForge.xcarchive -exportPath build/export -exportOptionsPlist ExportOptions.plist
          cp build/export/*.ipa build/NFCForge-signed.ipa

      - name: Build unsigned IPA fallback
        if: ${{ !(secrets.IOS_CERTIFICATE_BASE64 != '' && secrets.IOS_CERTIFICATE_PASSWORD != '' && secrets.IOS_PROVISION_PROFILE_BASE64 != '') }}
        run: |
          xcodebuild -project NFCForge.xcodeproj -scheme NFCForge -configuration Release -sdk iphoneos -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/NFCForge.app build/Payload/
          cd build && zip -qry NFCForge-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: NFCForge-IPA
          path: build/*.ipa
