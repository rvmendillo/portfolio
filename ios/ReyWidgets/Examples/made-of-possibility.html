<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<style>html,body{width:100%;height:100%;margin:0;overflow:hidden;box-sizing:border-box}*{box-sizing:inherit}</style>
<style>body{background:#deebcf;color:#1d3023;font-family:system-ui}
main{height:100%;padding:20px 24px;display:flex;flex-direction:column;position:relative}
.top,.bottom{display:flex;align-items:center;gap:7px;font:9px ui-monospace,monospace;letter-spacing:1px}
.dot{width:6px;height:6px;background:#3a7039;border-radius:100%}.star{margin-left:auto;font-size:26px}
h1{font-size:38px;line-height:.94;letter-spacing:-1.8px;margin:10px 0 8px;font-weight:650}
h1 br{display:none}em{font-family:Georgia,serif;font-weight:400}
p{font-size:11px;margin:0;max-width:220px}.bottom{margin-top:auto;font-size:7px;justify-content:space-between;opacity:.65}
@media(max-width:220px){main{padding:14px}.top{font-size:7px;letter-spacing:0}.star{font-size:20px}h1{font-size:29px}h1 br{display:block}p{font-size:9px}.bottom{font-size:6px}}
@media(min-height:250px){h1{font-size:68px;margin:30px 0 20px}h1 br{display:block}p{font-size:16px}.top{font-size:11px}}</style>
<script>
window.__rwError = null;
window.addEventListener('error',e=>{window.__rwError=e.message;});
window.addEventListener('unhandledrejection',e=>{window.__rwError=String(e.reason);});
window.widget = {
  data: JSON.parse(new TextDecoder().decode(Uint8Array.from(atob('eyJtZXNzYWdlIjogIk1ha2Ugc29tZXRoaW5nIHlvdXJzLiJ9'),c=>c.charCodeAt(0)))),
  size: 'medium', width: 364, height: 170,
  ready: Promise.resolve(),
  get(pointer, fallback='—') {
    if (pointer === '') return this.data;
    if (!pointer.startsWith('/')) return fallback;
    let node = this.data;
    for (const key of pointer.slice(1).split('/').map(k=>k.replace(/~1/g,'/').replace(/~0/g,'~'))) {
      if (node == null || !Object.prototype.hasOwnProperty.call(Object(node),key)) return fallback;
      node = node[key];
    }
    return node == null ? fallback : node;
  }
};
document.addEventListener('DOMContentLoaded',()=>{
  for (const el of document.querySelectorAll('[data-bind]')) {
    el.textContent = String(widget.get(el.getAttribute('data-bind')));
  }
});
</script></head><body><main>
  <div class="top"><span class="dot"></span> A LITTLE REMINDER <span class="star">✳</span></div>
  <h1>Make it<br> <em>yours.</em></h1>
  <p data-bind="/message"></p>
  <div class="bottom"><span>REYWIDGETS STUDIO</span><span>↗</span></div>
</main>
<script>document.addEventListener('DOMContentLoaded',()=>{
// Edit freely. No internet access is needed for this design.

});</script>
</body></html>
