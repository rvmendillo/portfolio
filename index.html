  <template id="app-settings"><div class="settings-app"><aside><h2>Settings</h2><label>⌕<input type="search" placeholder="Find a setting" maxlength="60"></label><button class="active" type="button">▣ Personalization</button><button type="button">◫ System</button><button type="button">♙ Accounts</button><button type="button">⌘ Accessibility</button><button type="button">⌁ Privacy & security</button></aside><section class="app-scroll"><header><div class="settings-avatar">RV</div><div><h1 data-settings-name>Rey Victor Mendillo</h1><p>Local Portfolio OS profile</p></div></header><h2>Choose a theme</h2><div class="theme-grid"><button class="active" type="button" data-theme-choice="windows"><i class="theme-preview windows-preview"></i><b>Windows 11</b><span>Glass + aurora</span></button><button type="button" data-theme-choice="ios"><i class="theme-preview ios-preview"></i><b>iOS</b><span>Floating dock</span></button><button type="button" data-theme-choice="resume"><i class="theme-preview resume-preview"></i><b>Resume</b><span>Montserrat paper</span></button></div><div class="settings-cards"><article><label><span><b>Profile name</b><small>Creates a separate local preference profile</small></span><input data-profile-name maxlength="40" value="Rey Victor Mendillo"></label></article><article><label><span><b>Accent color</b><small>Applied across Portfolio OS</small></span><input data-accent type="color" value="#59a8ff"></label></article><article><label><span><b>Transparency</b><small>Window glass intensity</small></span><input data-transparency type="range" min="55" max="96" value="78"></label></article><article><label><span><b>Animations</b><small>Window, menu, boot, and wallpaper motion</small></span><input data-motion-toggle type="checkbox" checked></label></article><article><div><span><b>Install Portfolio OS</b><small>Add this PWA to your home screen</small></span><button type="button" data-install-pwa>Install</button></div></article><article><div><span><b>Security baseline</b><small>CSP, safe DOM rendering, sandboxed inputs, URL allowlists, size limits, no eval</small></span><span class="secure-pill">Protected</span></div></article></div><button class="danger-button" type="button" data-reset-settings>Reset local settings</button></section></div></template>
  <template id="app-calculator"><div class="calculator-app"><div class="calculator-display"><small data-calc-expression></small><output data-calc-output>0</output></div><div class="calculator-grid"><button type="button" data-calc="clear">AC</button><button type="button" data-calc="sign">±</button><button type="button" data-calc="percent">%</button><button class="operator" type="button" data-calc="/">÷</button><button type="button" data-calc="7">7</button><button type="button" data-calc="8">8</button><button type="button" data-calc="9">9</button><button class="operator" type="button" data-calc="*">×</button><button type="button" data-calc="4">4</button><button type="button" data-calc="5">5</button><button type="button" data-calc="6">6</button><button class="operator" type="button" data-calc="-">−</button><button type="button" data-calc="1">1</button><button type="button" data-calc="2">2</button><button type="button" data-calc="3">3</button><button class="operator" type="button" data-calc="+">+</button><button class="zero" type="button" data-calc="0">0</button><button type="button" data-calc=".">.</button><button class="operator" type="button" data-calc="=">=</button></div></div></template>
