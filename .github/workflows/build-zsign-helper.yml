name: Build zsign helper

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-zsign-helper.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download zsign Linux x86_64
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 \
            https://github.com/zhlynn/zsign/releases/download/v1.1.2/zsign-linux-x86_64.tar.gz \
            -o zsign.tar.gz
          echo 'd55e6a8650949a260892a9687ac1dfe4a9c79c2e3ecfe00a0eeb09b7b694282e  zsign.tar.gz' | sha256sum -c -
          mkdir out
          tar -xzf zsign.tar.gz -C out
          find out -type f -maxdepth 2 -ls
          chmod +x out/zsign || chmod +x out/*/zsign
      - name: Upload helper
        uses: actions/upload-artifact@v4
        with:
          name: zsign-linux-x86_64
          path: out/**
          retention-days: 1
          if-no-files-found: error
