name: Temporary Build ReyForge 2.4

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-reyforge-2-1-temp.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Checkout ReyForge Foundation Models branch
        uses: actions/checkout@v6
        with:
          ref: reyforge-foundation-models

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Patch localhost installer for Swift 6
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ipa-builder-build/LocalhostInstaller.swift')
          s = p.read_text()

          start = s.index('    private func beginBackgroundTask() {')
          end = s.index('    private func publishStatus(', start)
          replacement = '''    private func beginBackgroundTask() {
              Task { @MainActor [weak self] in
                  guard let self, self.backgroundTask == .invalid else { return }
                  self.backgroundTask = UIApplication.shared.beginBackgroundTask(withName: "ReyForgeLocalInstall") { [weak self] in
                      self?.stopServer()
                  }
              }
          }

          private func endBackgroundTask() {
              Task { @MainActor [weak self] in
                  guard let self else { return }
                  let task = self.backgroundTask
                  guard task != .invalid else { return }
                  self.backgroundTask = .invalid
                  UIApplication.shared.endBackgroundTask(task)
              }
          }

          '''
          s = s[:start] + replacement + s[end:]

          old_cast = 'let identity = items.first?[kSecImportItemIdentity as String] as? SecIdentity else {'
          new_cast = 'let rawIdentity = items.first?[kSecImportItemIdentity as String] else {'
          if old_cast not in s:
              raise SystemExit('SecIdentity cast line not found')
          s = s.replace(old_cast, new_cast, 1)
          return_line = '        return identity\n'
          if return_line not in s:
              raise SystemExit('SecIdentity return line not found')
          s = s.replace(return_line, '        return rawIdentity as! SecIdentity\n', 1)
          p.write_text(s)
          PY

      - name: Generate ReyForge app icon
        run: |
          python3 -m venv /tmp/reyforge-icon-venv
          /tmp/reyforge-icon-venv/bin/python -m pip install --quiet pillow
          /tmp/reyforge-icon-venv/bin/python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          out = Path('ipa-builder-build/Assets.xcassets/AppIcon.appiconset/AppIcon.png')
          out.parent.mkdir(parents=True, exist_ok=True)
          size = 1024
          im = Image.new('RGB', (size, size), (27, 22, 60))
          d = ImageDraw.Draw(im)
          for y in range(size):
              t = y / (size - 1)
              c = (int(45 + 35*t), int(34 + 30*t), int(95 + 90*t))
              d.line((0, y, size, y), fill=c)
          d.rounded_rectangle((110,110,914,914), radius=215, fill=(59,48,132), outline=(205,190,255), width=18)
          d.polygon([(280,655),(468,467),(414,413),(226,601)], fill=(255,255,255))
          d.rounded_rectangle((420,240,730,420), radius=46, fill=(255,255,255))
          d.rounded_rectangle((510,378,618,730), radius=39, fill=(255,255,255))
          d.polygon([(616,620),(796,800),(724,872),(544,692)], fill=(255,255,255))
          try:
              font = ImageFont.truetype('/System/Library/Fonts/SFNS.ttf', 92)
          except Exception:
              font = ImageFont.load_default()
          label='2.4'
          box=d.textbbox((0,0),label,font=font)
          d.text(((size-(box[2]-box[0]))/2,800),label,font=font,fill=(238,233,255))
          im.save(out)
          PY

      - name: Generate Xcode project
        working-directory: ipa-builder-build
        run: xcodegen generate

      - name: Resolve Swift packages
        working-directory: ipa-builder-build
        run: |
          xcodebuild -resolvePackageDependencies \
            -project IPABuilder.xcodeproj \
            -scheme IPABuilder \
            -derivedDataPath build

      - name: Verify Feather Zsign revision
        working-directory: ipa-builder-build
        run: |
          test "$(git -C build/SourcePackages/checkouts/Zsign-Package rev-parse HEAD)" = "6ffe703df73ef9069adacdbb19d571f11a69a801"

      - name: Patch Zsign provisioning and callback behavior
        working-directory: ipa-builder-build
        run: |
          chmod u+w build/SourcePackages/checkouts/Zsign-Package/src/zsign.mm
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build/SourcePackages/checkouts/Zsign-Package/src/zsign.mm')
          s = p.read_text()
          old_call = 'bForce, bWeakInject, bEnableCache, excludeprovion);'
          new_call = 'bForce, bWeakInject, bEnableCache, !excludeprovion);'
          if old_call in s:
              s = s.replace(old_call, new_call, 1)
          old_cb = 'completionHandler(bRet, signError);'
          new_cb = 'if (completionHandler) { completionHandler(bRet, signError); }'
          if old_cb in s:
              s = s.replace(old_cb, new_cb, 1)
          p.write_text(s)
          PY

      - name: Build ReyForge 2.4 unsigned
        working-directory: ipa-builder-build
        run: |
          set -o pipefail
          xcodebuild \
            -project IPABuilder.xcodeproj \
            -scheme IPABuilder \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build | tee xcodebuild.log

      - name: Package and validate IPA
        working-directory: ipa-builder-build
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/ReyForge.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload ReyForge-2.4-unsigned.ipa
          unzip -t ReyForge-2.4-unsigned.ipa
          test -f Payload/ReyForge.app/ReyForge
          if find Payload/ReyForge.app -name '*.gguf' | grep -q .; then
            echo "Unexpected GGUF bundled"
            exit 1
          fi
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Payload/ReyForge.app/Info.plist)" = "2.4"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Payload/ReyForge.app/Info.plist)" = "8"
          file Payload/ReyForge.app/ReyForge
          du -h ReyForge-2.4-unsigned.ipa

      - name: Upload ReyForge IPA
        uses: actions/upload-artifact@v4
        with:
          name: ReyForge-2.4-unsigned-ipa
          path: ipa-builder-build/ReyForge-2.4-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
