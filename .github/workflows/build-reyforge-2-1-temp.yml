name: Temporary Build ReyForge 2.6

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-reyforge-2-1-temp.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Checkout ReyForge 2.6
        uses: actions/checkout@v6
        with:
          ref: reyforge-foundation-models

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install build tools
        run: |
          brew install xcodegen
          python3 -m venv /tmp/reyforge-icon-venv
          /tmp/reyforge-icon-venv/bin/python -m pip install --quiet pillow

      - name: Prepare semi-local installer
        run: python3 ipa-builder-build/patch_semi_local_installer.py

      - name: Generate app icon
        run: /tmp/reyforge-icon-venv/bin/python ipa-builder-build/generate_ci_icon.py

      - name: Generate Xcode project
        working-directory: ipa-builder-build
        run: xcodegen generate

      - name: Resolve Swift packages
        working-directory: ipa-builder-build
        run: xcodebuild -resolvePackageDependencies -project IPABuilder.xcodeproj -scheme IPABuilder -derivedDataPath build

      - name: Patch Zsign compatibility
        working-directory: ipa-builder-build
        run: |
          python3 -c "from pathlib import Path; p=Path('build/SourcePackages/checkouts/Zsign-Package/src/zsign.mm'); s=p.read_text(); s=s.replace('bForce, bWeakInject, bEnableCache, excludeprovion);','bForce, bWeakInject, bEnableCache, !excludeprovion);',1); s=s.replace('completionHandler(bRet, signError);','if (completionHandler) { completionHandler(bRet, signError); }',1); p.write_text(s)"

      - name: Build ReyForge 2.6 unsigned
        working-directory: ipa-builder-build
        run: |
          set -o pipefail
          xcodebuild -project IPABuilder.xcodeproj -scheme IPABuilder -configuration Release -sdk iphoneos -derivedDataPath build -disableAutomaticPackageResolution CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" clean build | tee xcodebuild.log

      - name: Package and validate IPA
        working-directory: ipa-builder-build
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/ReyForge.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload ReyForge-2.6-unsigned.ipa
          unzip -t ReyForge-2.6-unsigned.ipa
          test -f Payload/ReyForge.app/ReyForge
          test -z "$(find Payload/ReyForge.app -name '*.gguf' -print -quit)"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Payload/ReyForge.app/Info.plist)" = "2.6"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Payload/ReyForge.app/Info.plist)" = "11"
          file Payload/ReyForge.app/ReyForge
          du -h ReyForge-2.6-unsigned.ipa

      - name: Upload ReyForge IPA
        uses: actions/upload-artifact@v4
        with:
          name: ReyForge-2.6-unsigned-ipa
          path: ipa-builder-build/ReyForge-2.6-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
