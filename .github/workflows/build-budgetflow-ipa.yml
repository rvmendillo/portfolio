name: Build BudgetFlow IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-budgetflow-ipa.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source bundle
        shell: bash
        run: |
          cat budgetflow-build/source.b64.part00 budgetflow-build/source.b64.part01 budgetflow-build/source.b64.part02 budgetflow-build/source.b64.part03 > /tmp/BudgetFlow.b64
          /usr/bin/base64 -D -i /tmp/BudgetFlow.b64 -o /tmp/BudgetFlow-native-ios.zip
          mkdir -p /tmp/budgetflow-src
          unzip -q /tmp/BudgetFlow-native-ios.zip -d /tmp/budgetflow-src

      - name: Apply branded CSV-picker build
        shell: bash
        run: |
          printf '%s' '' | /usr/bin/base64 -D | gunzip -c > /tmp/budgetflow-src/BudgetFlow/BudgetFlow/Views.swift
          printf '%s' '' | /usr/bin/base64 -D | gunzip -c > /tmp/budgetflow-src/BudgetFlow/BudgetFlow/BudgetFlowApp.swift
          printf '%s' '' | /usr/bin/base64 -D | gunzip -c > /tmp/budgetflow-src/BudgetFlow/BudgetFlow/CSVImportService.swift
          printf '%s' '' | /usr/bin/base64 -D | gunzip -c > /tmp/budgetflow-src/BudgetFlow/BudgetFlow/FinanceStore.swift

      - name: Build unsigned iPhone app
        shell: bash
        run: |
          touch "$GITHUB_WORKSPACE/build.log"
          cd /tmp/budgetflow-src/BudgetFlow
          set -o pipefail
          xcodebuild -project BudgetFlow.xcodeproj -scheme BudgetFlow -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath /tmp/BudgetFlowDerived CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Package IPA
        shell: bash
        run: |
          APP="/tmp/BudgetFlowDerived/Build/Products/Release-iphoneos/BudgetFlow.app"
          test -d "$APP"
          rm -rf /tmp/ipa
          mkdir -p /tmp/ipa/Payload
          cp -R "$APP" /tmp/ipa/Payload/
          cd /tmp/ipa
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/BudgetFlow-branded-csv-picker.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: BudgetFlow-branded-csv-picker-IPA
          path: BudgetFlow-branded-csv-picker.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view budgetflow-build >/dev/null 2>&1 || gh release create budgetflow-build --title "BudgetFlow iOS Build" --notes "BudgetFlow iOS builds."
          gh release upload budgetflow-build BudgetFlow-branded-csv-picker.ipa build.log --clobber

      - name: Publish failure log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f build.log || echo "Build failed before xcodebuild started." > build.log
          gh release view budgetflow-build-log >/dev/null 2>&1 || gh release create budgetflow-build-log --title "BudgetFlow iOS Build Log" --notes "Latest failed BudgetFlow IPA build log."
          gh release upload budgetflow-build-log build.log --clobber
