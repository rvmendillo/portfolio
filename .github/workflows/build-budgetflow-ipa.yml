name: Build BudgetFlow IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'budgetflow-build/source.b64.part*'
      - '.github/workflows/build-budgetflow-ipa.yml'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source bundle
        shell: bash
        run: |
          cat budgetflow-build/source.b64.part00               budgetflow-build/source.b64.part01               budgetflow-build/source.b64.part02               budgetflow-build/source.b64.part03 > /tmp/BudgetFlow.b64
          base64 --decode /tmp/BudgetFlow.b64 > /tmp/BudgetFlow-native-ios.zip
          mkdir -p /tmp/budgetflow-src
          unzip -q /tmp/BudgetFlow-native-ios.zip -d /tmp/budgetflow-src
          test -f /tmp/budgetflow-src/BudgetFlow/BudgetFlow.xcodeproj/project.pbxproj

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned iPhone app
        shell: bash
        run: |
          cd /tmp/budgetflow-src/BudgetFlow
          xcodebuild             -project BudgetFlow.xcodeproj             -scheme BudgetFlow             -configuration Release             -sdk iphoneos             -destination 'generic/platform=iOS'             -derivedDataPath /tmp/BudgetFlowDerived             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             build

      - name: Package IPA
        shell: bash
        run: |
          APP="/tmp/BudgetFlowDerived/Build/Products/Release-iphoneos/BudgetFlow.app"
          test -d "$APP"
          rm -rf /tmp/ipa
          mkdir -p /tmp/ipa/Payload
          cp -R "$APP" /tmp/ipa/Payload/
          cd /tmp/ipa
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/BudgetFlow-unsigned.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/BudgetFlow-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BudgetFlow-unsigned-IPA
          path: BudgetFlow-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
