name: Temporary Build ReyForge 2.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-reyforge-2-temp.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout ReyForge source branch
        uses: actions/checkout@v6
        with:
          ref: ipa-builder-build-20260903

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download bundled local SmolLM2
        run: |
          mkdir -p ipa-builder-build/Resources
          curl --fail --location --retry 3 \
            "https://huggingface.co/unsloth/SmolLM2-360M-Instruct-GGUF/resolve/main/SmolLM2-360M-Instruct-Q4_K_M.gguf?download=true" \
            --output ipa-builder-build/Resources/SmolLM2-360M-Instruct-Q4_K_M.gguf
          test -s ipa-builder-build/Resources/SmolLM2-360M-Instruct-Q4_K_M.gguf
          echo "16c7f1667fea34bacad196a57b548effcb37614db4ab5677a20c8c7b823b9e63  ipa-builder-build/Resources/SmolLM2-360M-Instruct-Q4_K_M.gguf" | shasum -a 256 -c -
          ls -lh ipa-builder-build/Resources/SmolLM2-360M-Instruct-Q4_K_M.gguf

      - name: Generate ReyForge app icon
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          out = Path('ipa-builder-build/Assets.xcassets/AppIcon.appiconset/AppIcon.png')
          out.parent.mkdir(parents=True, exist_ok=True)
          size = 1024
          im = Image.new('RGB', (size, size), (28, 24, 58))
          d = ImageDraw.Draw(im)
          for y in range(size):
              t = y / (size - 1)
              c = (int(45 + 35*t), int(35 + 30*t), int(95 + 85*t))
              d.line((0, y, size, y), fill=c)
          d.rounded_rectangle((118,118,906,906), radius=210, fill=(60,51,130), outline=(188,170,255), width=18)
          d.polygon([(290,660),(472,478),(421,427),(239,609)], fill=(255,255,255))
          d.rounded_rectangle((426,250,720,420), radius=44, fill=(255,255,255))
          d.rounded_rectangle((511,380,614,725), radius=38, fill=(255,255,255))
          d.polygon([(614,620),(790,796),(720,866),(544,690)], fill=(255,255,255))
          try:
              font = ImageFont.truetype('/System/Library/Fonts/SFNS.ttf', 110)
          except Exception:
              font = ImageFont.load_default()
          label='RF'
          box=d.textbbox((0,0),label,font=font)
          d.text(((size-(box[2]-box[0]))/2,790),label,font=font,fill=(235,230,255))
          im.save(out)
          PY
          sips -g pixelWidth -g pixelHeight ipa-builder-build/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Generate Xcode project
        working-directory: ipa-builder-build
        run: xcodegen generate

      - name: Resolve Swift packages
        working-directory: ipa-builder-build
        run: |
          xcodebuild -resolvePackageDependencies \
            -project IPABuilder.xcodeproj \
            -scheme IPABuilder

      - name: Build ReyForge 2.0 unsigned
        working-directory: ipa-builder-build
        run: |
          set -o pipefail
          xcodebuild \
            -project IPABuilder.xcodeproj \
            -scheme IPABuilder \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build | tee xcodebuild.log

      - name: Package and validate IPA
        working-directory: ipa-builder-build
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/ReyForge.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload ReyForge-2.0-unsigned.ipa
          unzip -t ReyForge-2.0-unsigned.ipa
          test -f Payload/ReyForge.app/ReyForge
          test -f Payload/ReyForge.app/SmolLM2-360M-Instruct-Q4_K_M.gguf
          file Payload/ReyForge.app/ReyForge
          du -h ReyForge-2.0-unsigned.ipa

      - name: Upload ReyForge IPA
        uses: actions/upload-artifact@v4
        with:
          name: ReyForge-2.0-unsigned-ipa
          path: ipa-builder-build/ReyForge-2.0-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
