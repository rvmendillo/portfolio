name: Build NFC Forge IPA

on:
  push:
    branches: [main]
    paths:
      - 'ios/NFCForge/**'
      - '.github/workflows/build-nfcforge-ipa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare NFC Forge source
        run: |
          if [ -f ios/NFCForge/project/project.yml ]; then
            echo "PROJECT_DIR=$GITHUB_WORKSPACE/ios/NFCForge/project" >> "$GITHUB_ENV"
          else
            cat ios/NFCForge/source.part.* > "$RUNNER_TEMP/NFCForge.b64"
            python3 - <<'PY'
          import base64, os
          from pathlib import Path
          raw = Path(os.environ['RUNNER_TEMP']) / 'NFCForge.b64'
          out = Path(os.environ['RUNNER_TEMP']) / 'NFCForge-source.zip'
          out.write_bytes(base64.b64decode(raw.read_text()))
          PY
            unzip -t "$RUNNER_TEMP/NFCForge-source.zip"
            rm -rf "$RUNNER_TEMP/NFCForgeExtract"
            mkdir -p "$RUNNER_TEMP/NFCForgeExtract"
            unzip -q "$RUNNER_TEMP/NFCForge-source.zip" -d "$RUNNER_TEMP/NFCForgeExtract"
            test -f "$RUNNER_TEMP/NFCForgeExtract/NFCForge/project.yml"
            echo "PROJECT_DIR=$RUNNER_TEMP/NFCForgeExtract/NFCForge" >> "$GITHUB_ENV"
          fi

      - name: Apply Xcode 16.4 compatibility patch
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['PROJECT_DIR']) / 'NFCForge' / 'Services'

          codec = root / 'NDEFCodec.swift'
          text = codec.read_text()
          text = text.replace(
              '        if let (text, locale) = payload.wellKnownTypeTextPayload(), let text {',
              '        let (text, locale) = payload.wellKnownTypeTextPayload()\n        if let text {'
          )
          codec.write_text(text)
          assert 'if let (text, locale) = payload.wellKnownTypeTextPayload()' not in text
          assert 'let (text, locale) = payload.wellKnownTypeTextPayload()' in text

          service = root / 'NFCService.swift'
          text = service.read_text()
          old = '        let session = NFCTagReaderSession(pollingOption: [.iso14443, .iso15693, .iso18092], delegate: self, queue: nil)'
          new = '''        guard let session = NFCTagReaderSession(pollingOption: [.iso14443, .iso15693, .iso18092], delegate: self, queue: nil) else {
              errorMessage = "Unable to start the NFC tag reader session."
              isScanning = false
              return
          }'''
          text = text.replace(old, new)
          service.write_text(text)
          assert old not in text
          assert 'guard let session = NFCTagReaderSession' in text
          PY

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen --version

      - name: Generate Xcode project
        run: |
          cd "$PROJECT_DIR"
          xcodegen generate
          xcodebuild -list -project NFCForge.xcodeproj

      - name: Build unsigned iPhone app
        run: |
          cd "$PROJECT_DIR"
          xcodebuild \
            -project NFCForge.xcodeproj \
            -scheme NFCForge \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/NFCForgeDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/NFCForgeDerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -type d | head -n 1)"
          test -n "$APP_PATH"
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          /usr/bin/zip -qry NFCForge-unsigned.ipa Payload
          unzip -t NFCForge-unsigned.ipa
          ls -lh NFCForge-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NFCForge-unsigned-IPA
          path: ${{ runner.temp }}/NFCForge-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish IPA and editable source
        if: github.event_name == 'push'
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p builds
          cp "$RUNNER_TEMP/NFCForge-unsigned.ipa" builds/NFCForge-unsigned.ipa
          if [ ! -f ios/NFCForge/project/project.yml ]; then
            rm -rf ios/NFCForge/project
            mkdir -p ios/NFCForge/project
            cp -R "$PROJECT_DIR"/. ios/NFCForge/project/
            rm -f ios/NFCForge/source.part.* ios/NFCForge/NFCForge-source.zip
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds/NFCForge-unsigned.ipa ios/NFCForge
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish NFC Forge IPA and source [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
