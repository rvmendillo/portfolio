name: IPA Builder Service
run-name: IPA Builder ${{ inputs.job_id || github.sha }}

on:
  push:
    branches: [ipa-builder-jobs]
    paths:
      - "ipa-builder-jobs/**/project.json"
  workflow_dispatch:
    inputs:
      job_id:
        description: Unique build job ID
        required: true
        type: string
      job_path:
        description: Project JSON path on ipa-builder-jobs branch
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout build service
        uses: actions/checkout@v6
        with:
          ref: main
          path: service
          fetch-depth: 0

      - name: Resolve build job
        id: job
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_JOB_ID: ${{ inputs.job_id }}
          INPUT_JOB_PATH: ${{ inputs.job_path }}
        run: |
          git -C service fetch origin ipa-builder-jobs
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            JOB_ID="$INPUT_JOB_ID"
            JOB_PATH="$INPUT_JOB_PATH"
          else
            JOB_PATH="$(git -C service diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^ipa-builder-jobs/.*/project.json$' | tail -1)"
            JOB_ID="$(basename "$(dirname "$JOB_PATH")")"
          fi
          test -n "$JOB_ID"
          test -n "$JOB_PATH"
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
          echo "job_path=$JOB_PATH" >> "$GITHUB_OUTPUT"

      - name: Read project from isolated jobs branch
        env:
          JOB_PATH: ${{ steps.job.outputs.job_path }}
        run: |
          git -C service show "origin/ipa-builder-jobs:${JOB_PATH}" > /tmp/project.json
          python3 -m json.tool /tmp/project.json >/dev/null

      - name: Generate safe native SwiftUI target
        run: |
          mkdir -p /tmp/ipa-builder-generated
          python3 service/ipa-builder-service/generate.py \
            /tmp/project.json \
            /tmp/ipa-builder-generated/App.swift \
            /tmp/ipa-builder-generated/project.yml

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: /tmp/ipa-builder-generated
        run: xcodegen generate

      - name: Build unsigned iPhone application
        working-directory: /tmp/ipa-builder-generated
        run: |
          set -o pipefail
          xcodebuild \
            -project GeneratedApp.xcodeproj \
            -scheme GeneratedApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build | tee xcodebuild.log

      - name: Package IPA
        working-directory: /tmp/ipa-builder-generated
        env:
          JOB_ID: ${{ steps.job.outputs.job_id }}
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/GeneratedApp.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload "Generated-${JOB_ID}.ipa"
          unzip -t "Generated-${JOB_ID}.ipa"
          test -f Payload/GeneratedApp.app/GeneratedApp

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa-${{ steps.job.outputs.job_id }}
          path: /tmp/ipa-builder-generated/Generated-${{ steps.job.outputs.job_id }}.ipa
          if-no-files-found: error
          retention-days: 7
