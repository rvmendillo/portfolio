name: Build Native iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, codex/rey-os-reimplementation]
    paths:
      - "ios-native/**"
      - "shared/**"
      - "scripts/prepare-native.py"
      - ".github/workflows/build-native-ios.yml"

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios-native
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache verified runtimes and model
        uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: .dependency-cache
          key: rey-native-device-simulator-b10927-python-314-b11-qwen-ebb2015

      - name: Prepare pinned on-device dependencies
        run: python3 ../scripts/prepare-native.py

      - name: Save compiled Simulator runtime and model cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .dependency-cache
          key: rey-native-device-simulator-b10927-python-314-b11-qwen-ebb2015

      - name: Generate native Xcode project
        run: xcodegen generate

      - name: Test real Python and bundled local model on iOS Simulator
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if x["name"].startswith("iPhone")))')
          xcodebuild test -project ReyPortfolioNative.xcodeproj -scheme ReyPortfolioNative -destination "id=$SIMULATOR_ID" -derivedDataPath build-simulator -resultBundlePath native-tests.xcresult CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned native application
        run: |
          xcodebuild \
            -project ReyPortfolioNative.xcodeproj \
            -scheme ReyPortfolioNative \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Confirm native-only binary
        run: |
          if grep -R "WKWebView\|WebKit" ReyPortfolioNative; then
            echo "Native target must not contain a web view"
            exit 1
          fi

      - name: Package native IPA for Feather
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/ReyPortfolioNative.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload ReyPortfolioNative-unsigned.ipa

      - name: Upload native IPA
        uses: actions/upload-artifact@v4
        with:
          name: ReyPortfolioNative-unsigned-ipa
          path: ios-native/ReyPortfolioNative-unsigned.ipa
          if-no-files-found: error

      - name: Upload native test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReyOS-native-test-results
          path: ios-native/native-tests.xcresult
          if-no-files-found: ignore
