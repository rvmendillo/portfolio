name: Temporary Build IPA Builder

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-ipa-builder-temp.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout IPA Builder branch
        uses: actions/checkout@v6
        with:
          ref: ipa-builder-build-20260903

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ipa-builder-build
        run: xcodegen generate

      - name: Build unsigned device app
        working-directory: ipa-builder-build
        run: |
          set -o pipefail
          xcodebuild \
            -project IPABuilder.xcodeproj \
            -scheme IPABuilder \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build | tee xcodebuild.log

      - name: Package IPA for Feather
        working-directory: ipa-builder-build
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/IPABuilder.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload IPABuilder-unsigned.ipa
          unzip -t IPABuilder-unsigned.ipa
          test -f Payload/IPABuilder.app/IPABuilder

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: IPABuilder-unsigned-ipa
          path: ipa-builder-build/IPABuilder-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
